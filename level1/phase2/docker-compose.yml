#step 1: write services

services:
  # step 2:container ka naam rakhna hai
  backend:
    #step 2: image k naam likhna hai
    #docker file build jbh image m convert hogi wo wali file use krenge therefore use build
    build: ./backend

    #step 3:here we can specify the port mapping prior
    ports:
      - 8000:5000
    env_file:
      - ./backend/.env

  frontend:
    build: ./frontend
    ports:
      - 5173:5173

  redis:
    image: redis
    ports:
      - 6379:6379
